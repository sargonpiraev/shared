name: Setup Node + npm ci
description: Node 24, npm cache, install dependencies

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: npm

    - shell: bash
      run: npm ci

    - name: Materialize apps/* .env from examples
      shell: bash
      run: |
        set -euo pipefail
        find ./apps -name '.env.example' -not -path '*/node_modules/*' | while IFS= read -r example; do
          dest="${example%.example}"
          if [ ! -f "$dest" ]; then
            cp "$example" "$dest"
          fi
        done
