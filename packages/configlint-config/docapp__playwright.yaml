# apps/docapp playwright.config.ts — skipped when the dir is absent.
# Lanes: package.json --grep tags. Projects: desktop + mobile viewports.
# CI still runs npm run test:spec:visual / test:spec:perf.
version: 1

rules:
  - id: docapp-playwright
    kind: for_each_dir
    select: ['apps/docapp']
    level: error
    message: 'apps/docapp Playwright contract: desktop/mobile projects and tagged npm lanes'
    require:
      - {
          paths: '{path}/playwright.config.ts',
          kind: file_content_matches,
          pattern: "name:\\s*[\"']desktop[\"']",
        }
      - {
          paths: '{path}/playwright.config.ts',
          kind: file_content_matches,
          pattern: "name:\\s*[\"']mobile[\"']",
        }
      - {
          paths: '.github/workflows/on-push-main.yml',
          kind: file_content_matches,
          pattern: 'npm run test:spec:visual',
        }
      - {
          paths: '.github/workflows/on-push-main.yml',
          kind: file_content_matches,
          pattern: 'npm run test:spec:perf',
        }
      - {
          paths: '.github/workflows/on-push-main.yml',
          kind: file_content_matches,
          pattern: 'npm run test:spec',
        }
