# Clone-root .alint.configlint.yaml. Presence stays in fslint-config.
# Pins live in templates/project__.alint.configlint.yaml.schema.json (leaf names, not SRI).
# Do not extend this from meta (meta extends a subset).
# Top-level json_schema_passes so allow_out_of_root applies (not nested require:).
version: 1

rules:
  - id: project__.alint.configlint.yaml
    kind: json_schema_passes
    paths:
      include: .alint.configlint.yaml
    schema_path: node_modules/@sargonpiraev/configlint-config/templates/project__.alint.configlint.yaml.schema.json
    level: error
    message: 'clone-root .alint.configlint.yaml must extend the product configlint leaves'
