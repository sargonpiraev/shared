# Clone-root .cursor/worktrees.json. Presence stays in fslint-config.
# Pin is json_path (no cross_file / templates/ read) so a symlink'd
# configlint-config does not escape the clone root.
version: 1

rules:
  - id: project__.cursor__worktrees.json
    kind: json_path_equals
    paths:
      include: .cursor/worktrees.json
    path: "$['setup-worktree-unix']"
    equals:
      - npm ci
      - npx lefthook install
      - find "$ROOT_WORKTREE_PATH" -name '.env' -not -path '*/node_modules/*' -print0 | while IFS= read -r -d '' f; do rel="${f#"$ROOT_WORKTREE_PATH"/}"; mkdir -p "$(dirname "$rel")"; cp "$f" "$rel"; done
    level: error
    message: 'clone-root .cursor/worktrees.json setup-worktree-unix must match the portfolio template'
