# Clone-root .nvmrc. Presence stays in fslint-config.
# Pin is inline (no cross_file / templates/.nvmrc read) so a symlink'd
# configlint-config does not escape the clone root.
version: 1

rules:
  - id: project__.nvmrc
    kind: file_content_matches
    paths:
      include: .nvmrc
      exclude: ['**/apps/**', '**/packages/**']
    pattern: '(?s)\Av24\.18\.0\n\z'
    level: error
    message: 'clone-root .nvmrc must be exactly v24.18.0'
