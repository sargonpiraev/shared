# Clone-root lefthook.yml. Presence stays in fslint-config.
# Pins live in templates/project__lefthook.yml.schema.json.
# Top-level json_schema_passes so allow_out_of_root applies (not nested require:).
version: 1

rules:
  - id: project__lefthook.yml
    kind: json_schema_passes
    paths:
      include: lefthook.yml
      exclude: ['**/apps/**', '**/packages/**']
    schema_path: node_modules/@sargonpiraev/configlint-config/templates/project__lefthook.yml.schema.json
    level: error
    message: 'clone-root lefthook.yml must be extends: ./node_modules/@sargonpiraev/lefthook-config/lefthook.yml'

  - id: project__lefthook.yml-no-skip
    kind: file_content_forbidden
    paths:
      include: lefthook.yml
      exclude: ['**/apps/**', '**/packages/**']
    pattern: 'skip:\\s*true'
    level: error
    message: 'clone-root lefthook.yml must not skip hooks'

  - id: project__on-push-main-reusable
    kind: for_each_file
    select: .github/workflows/on-push-main.yml
    when_iter: 'iter.path == ".github/workflows/on-push-main.yml"'
    level: error
    message: 'on-push-main.yml must call shared reusable workflow or be that reusable (workflow_call)'
    require:
      - {
          paths: '{path}',
          kind: file_content_matches,
          pattern: 'sargonpiraev/shared/.github/workflows/on-push-main\.yml|workflow_call',
        }
