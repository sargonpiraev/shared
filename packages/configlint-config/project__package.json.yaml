# Clone-root package.json. Presence stays in fslint-config.
# Pins live in templates/project__package.json.schema.json (`const`).
# Do not extend this from meta (scripts differ).
# Top-level json_schema_passes so allow_out_of_root applies (not nested require:).
version: 1

rules:
  - id: project__package.json
    kind: json_schema_passes
    paths:
      include: package.json
      exclude: ['**/apps/**', '**/packages/**', '**/pulumi/**']
    schema_path: node_modules/@sargonpiraev/configlint-config/templates/project__package.json.schema.json
    level: error
    message: 'clone-root package.json scripts do not match the portfolio contract'
