# Clone-root Nx project.json. Presence stays in fslint-config.
# Pins live in templates/project__project.json.schema.json (`const`).
# Do not extend this from meta.
version: 1

rules:
  - id: project__project.json
    kind: for_each_file
    select: project.json
    when_iter: 'iter.path == "project.json"'
    level: error
    message: 'clone-root project.json targets do not match the portfolio contract'
    require:
      - {
          paths: '{path}',
          kind: json_schema_passes,
          schema_path: node_modules/@sargonpiraev/configlint-config/templates/project__project.json.schema.json,
        }
      - { paths: '{path}', kind: file_content_forbidden, pattern: '"test:lint"' }
      - { paths: '{path}', kind: file_content_forbidden, pattern: '"test:alint"' }
      - { paths: '{path}', kind: file_content_forbidden, pattern: '"test:conftest"' }
