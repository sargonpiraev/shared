# Clone-root Nx project.json. Presence stays in fslint-config.
# metadata.portBegins = LocalProxy port space (50000–59900, step 100).
# Do not extend this from meta.
# Top-level json_schema_passes so allow_out_of_root applies (not nested require:).
version: 1

rules:
  - id: project__project.json
    kind: json_schema_passes
    paths:
      include: project.json
      exclude: ['**/apps/**', '**/packages/**', '**/pulumi/**']
    schema_path: node_modules/@sargonpiraev/configlint-config/templates/project__project.json.schema.json
    level: error
    message: 'clone-root project.json does not match the portfolio contract'
