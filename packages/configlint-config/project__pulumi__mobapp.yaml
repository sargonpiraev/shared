# apps/mobapp ⇒ apps/mobapp/pulumi.ts must construct Mobapp in this file (not pulumi/index.ts).
# Skipped when the dir is absent (for_each_dir).
version: 1

rules:
  - id: pulumi-mobapp
    kind: for_each_dir
    select: ['apps/mobapp']
    level: error
    message: 'apps/mobapp/pulumi.ts must contain new Mobapp('
    require:
      - { paths: '{path}/pulumi.ts', kind: file_content_matches, pattern: "new\\s+Mobapp\\s*\\(" }
  - id: pulumi-mobapp-not-index
    kind: for_each_dir
    select: ['apps/mobapp']
    level: error
    message: 'new Mobapp( belongs in apps/mobapp/pulumi.ts, not pulumi/index.ts'
    require:
      - { paths: pulumi/index.ts, kind: file_content_forbidden, pattern: "new\\s+Mobapp\\s*\\(" }
