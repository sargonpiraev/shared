# Clone-root turbo.json. Presence stays in fslint-config.
# Pins live in templates/project__turbo.json.schema.json (`const` + required task).
# Do not extend this from meta.
version: 1

rules:
  - id: project__turbo.json
    kind: for_each_file
    select: turbo.json
    when_iter: 'iter.path == "turbo.json"'
    level: error
    message: 'clone-root turbo.json does not match the portfolio contract'
    require:
      - {
          paths: '{path}',
          kind: json_schema_passes,
          schema_path: node_modules/@sargonpiraev/configlint-config/templates/project__turbo.json.schema.json,
        }
