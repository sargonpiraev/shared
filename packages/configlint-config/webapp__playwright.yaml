# apps/webapp + optional repo-root playwright.config.ts (flat webapp).
# Skipped when the file/dir is absent. Presence of the file stays in fslint-config.
# Lanes are npm scripts + Playwright tags (--grep @seokit), not one project per suite.
# Playwright projects are viewports: desktop + mobile.
# CI still runs npm run test:spec:visual / test:spec:perf.
version: 1

rules:
  - id: webapp-playwright
    kind: for_each_dir
    select: ['apps/webapp']
    level: error
    message: 'apps/webapp Playwright contract: desktop/mobile projects and tagged npm lanes'
    require:
      - {
          paths: '{path}/playwright.config.ts',
          kind: file_content_matches,
          pattern: "name:\\s*[\"']desktop[\"']",
        }
      - {
          paths: '{path}/playwright.config.ts',
          kind: file_content_matches,
          pattern: "name:\\s*[\"']mobile[\"']",
        }
      - { paths: '{path}/package.json', kind: file_content_matches, pattern: '--grep @feat' }
      - { paths: '{path}/package.json', kind: file_content_matches, pattern: '--grep @seokit' }
      - { paths: '{path}/package.json', kind: file_content_matches, pattern: '--grep @analytics' }
      - { paths: '{path}/package.json', kind: file_content_matches, pattern: '--grep @visual' }
      - { paths: '{path}/package.json', kind: file_content_matches, pattern: '--grep @perf' }
      - {
          paths: '{path}/package.json',
          kind: file_content_matches,
          pattern: "@feat\\|@seokit\\|@analytics",
        }
      - {
          paths: '.github/workflows/on-push-main.yml',
          kind: file_content_matches,
          pattern: 'npm run test:spec:visual',
        }
      - {
          paths: '.github/workflows/on-push-main.yml',
          kind: file_content_matches,
          pattern: 'npm run test:spec:perf',
        }
      - {
          paths: '.github/workflows/on-push-main.yml',
          kind: file_content_matches,
          pattern: "npm run test:spec|install-playwright:\\s*true",
        }

  - id: webapp-page-spec-tags
    kind: for_each_file
    select: ['apps/webapp/**/page.spec.ts']
    level: error
    message: 'each apps/webapp page.spec.ts must declare @feat @seokit @analytics @visual @perf tags'
    require:
      - { paths: '{path}', kind: file_content_matches, pattern: '@feat' }
      - { paths: '{path}', kind: file_content_matches, pattern: '@seokit' }
      - { paths: '{path}', kind: file_content_matches, pattern: '@analytics' }
      - { paths: '{path}', kind: file_content_matches, pattern: '@visual' }
      - { paths: '{path}', kind: file_content_matches, pattern: '@perf' }

  - id: root-playwright-desktop
    kind: file_content_matches
    level: error
    paths:
      include: playwright.config.ts
      exclude: ['**/apps/**']
    pattern: "name:\\s*[\"']desktop[\"']"
  - id: root-playwright-mobile
    kind: file_content_matches
    level: error
    paths:
      include: playwright.config.ts
      exclude: ['**/apps/**']
    pattern: "name:\\s*[\"']mobile[\"']"
