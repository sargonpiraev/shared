# apps/extapp — skipped when the dir is absent (for_each_dir).
# Nested require paths need `{path}/…` (not bare basenames).
version: 1

rules:
  - id: extapp
    kind: for_each_dir
    select: ["apps/extapp"]
    level: error
    message: "apps/extapp is missing required files or dirs"
    require:
      - { paths: "{path}/entrypoints", kind: dir_exists }
      - { paths: "{path}/public", kind: dir_exists }
      - { paths: "{path}/package.json", kind: file_exists }
      - { paths: "{path}/playwright.config.ts", kind: file_exists }
      - { paths: "{path}/tsconfig.json", kind: file_exists }
      - { paths: "{path}/wxt.config.ts", kind: file_exists }
