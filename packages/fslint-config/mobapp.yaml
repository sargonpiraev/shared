# apps/mobapp — skipped when the dir is absent (for_each_dir).
# Nested require paths need `{path}/…` (not bare basenames).
version: 1

rules:
  - id: mobapp
    kind: for_each_dir
    select: ["apps/mobapp"]
    level: error
    message: "apps/mobapp is missing required files or dirs"
    require:
      - { paths: "{path}/assets", kind: dir_exists }
      - { paths: "{path}/src", kind: dir_exists }
      - { paths: "{path}/app.json", kind: file_exists }
      - { paths: "{path}/package.json", kind: file_exists }
      - { paths: "{path}/tsconfig.json", kind: file_exists }
