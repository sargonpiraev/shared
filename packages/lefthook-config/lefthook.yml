# Provider baseline for consumer Lefthook `extends`
# (path: packages/lefthook-config/lefthook.yml).
# Cheap gates on pre-commit; full on-push-main set on pre-push (including audit).
# Do not run umbrella `npm run test` — it re-runs the static gates above.
# Commitlint on commit-msg. No interactive Commitizen — agents use `git commit -m`.

pre-commit:
  parallel: false
  commands:
    test-fslint:
      run: npm run test:fslint
      priority: 1
    test-configlint:
      run: npm run test:configlint
      priority: 2
    test-format:
      run: npm run test:format
      priority: 3
    test-lint:
      run: npm run test:eslint
      priority: 4
    test-check-types:
      run: npm run test:check-types
      priority: 5

commit-msg:
  parallel: false
  commands:
    commitlint:
      run: npx commitlint --edit {1}
      priority: 1

pre-push:
  parallel: false
  commands:
    test-fslint:
      run: npm run test:fslint
      priority: 1
    test-configlint:
      run: npm run test:configlint
      priority: 2
    test-format:
      run: npm run test:format
      priority: 3
    test-lint:
      run: npm run test:eslint
      priority: 4
    test-check-types:
      run: npm run test:check-types
      priority: 5
    test-unit:
      run: npm run test:unit
      priority: 6
    test-build:
      run: npm run build
      priority: 7
    test-spec:
      run: npm run test:spec
      priority: 8
    test-audit:
      run: npm audit --audit-level=critical
      priority: 9

# After a successful push: wait for GitHub Actions on HEAD.
# Skip locally: lefthook-local.yml → post-push.exclude_tags: [github-ci]
post-push:
  parallel: false
  commands:
    test-ci:
      tags:
        - github-ci
      run: |
        sha=$(git rev-parse HEAD)
        id=$(gh run list --commit "$sha" --limit 1 --json databaseId --jq '.[0].databaseId')
        gh run watch "$id" --exit-status || { gh run view "$id"; exit 1; }
      priority: 1

