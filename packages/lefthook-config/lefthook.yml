# Provider baseline for consumer lefthook remotes
# (path: packages/lefthook-config/lefthook.yml).
# Mirrors on-push-main baseline checks.

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    fslint:
      run: npm run test:fslint
    configlint:
      run: npm run test:configlint
    lint:
      run: npm run test:eslint
    check-types:
      run: npm run check-types
    build:
      run: npm run build
    test:
      run: npm run test
    audit:
      tags:
        - audit
      run: npm audit --audit-level=critical
