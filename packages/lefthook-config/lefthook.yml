# Provider baseline for consumer Lefthook `extends`
# (path: packages/lefthook-config/lefthook.yml).
# Cheap gates on pre-commit; full on-push-main set on pre-push (including audit).
# Do not run umbrella `npm run test` — it re-runs the static gates above.
# Commitlint on commit-msg. No interactive Commitizen — agents use `git commit -m`.

pre-commit:
  parallel: false
  commands:
    fslint:
      run: npm run test:fslint
    configlint:
      run: npm run test:configlint
    format:
      run: npm run test:format
    lint:
      run: npm run test:eslint
    check-types:
      run: npm run test:check-types

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    fslint:
      run: npm run test:fslint
    configlint:
      run: npm run test:configlint
    format:
      run: npm run test:format
    lint:
      run: npm run test:eslint
    check-types:
      run: npm run test:check-types
    unit:
      run: npm run test:unit
    build:
      run: npm run build
    spec:
      run: npm run test:spec
    audit:
      run: npm audit --audit-level=critical
